<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071b2f">
  <title>SSCP Practice Lab</title>
  <meta name="description" content="ISC2 SSCP試験対策のための演習アプリ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="SSCP Practice Lab ホーム">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span><strong>SSCP</strong><small>Practice Lab</small></span>
      </a>

      <div class="mode-card">
        <span class="mode-dot"></span>
        <span><small>LEARNING MODE</small><strong>Domain Practice</strong></span>
      </div>

      <nav aria-label="ドメイン選択">
        <p class="nav-label">DOMAINS</p>
        <div id="category-list" class="category-list"></div>
      </nav>

      <div class="sidebar-tip">
        <span class="tip-icon">◎</span>
        <div><strong>試験の視点</strong><p>正しい対策ではなく、状況に対して最も適切な対策を選びます。</p></div>
      </div>
      <p class="disclaimer">Independent study tool<br>Not affiliated with ISC2</p>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">SYSTEMS SECURITY CERTIFIED PRACTITIONER</p>
          <h1>SSCP 演習問題</h1>
          <p class="lead">シナリオを読み、セキュリティ実務者として最善の判断を選択してください。</p>
        </div>
        <div class="practice-badge"><span>●</span> PRACTICE</div>
      </header>

      <section id="content-area" class="content-area" aria-live="polite">
        <div class="loading-panel"><span class="spinner"></span><div><strong>問題を読み込んでいます</strong><p>しばらくお待ちください。</p></div></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
